# LiteLLM proxy configuration (mounted read-only at /etc/litellm/config.yaml).
# Design notes are in README.md next to this file.

model_list:
  # Claude via each engineer's OWN subscription (Claude Code /login inside the
  # session). There is deliberately NO Anthropic API key configured: a request
  # without a valid client OAuth token fails, and never silently falls back to
  # company-billed credentials. LiteLLM forwards the client's OAuth token to
  # direct anthropic/ deployments (LiteLLM >= 1.81.14).
  - model_name: "claude-*"
    litellm_params:
      model: "anthropic/claude-*"
  - model_name: "anthropic/*"
    litellm_params:
      model: "anthropic/*"

  # API-key mode (company-billed), enable when keys exist. The key lives only in
  # the litellm-provider-keys Secret and never reaches a session.
  # - model_name: "claude-*"
  #   litellm_params:
  #     model: "anthropic/claude-*"
  #     api_key: os.environ/ANTHROPIC_API_KEY
  # Codex (OpenAI Responses API) through the gateway. Codex's ChatGPT-subscription
  # login talks to chatgpt.com directly and would bypass the gateway, so Codex is
  # API-key mode only. Not implemented in this demo (design stub).
  # - model_name: "gpt-*"
  #   litellm_params:
  #     model: "openai/gpt-*"
  #     api_key: os.environ/OPENAI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY        # admin only, never given to sessions
  database_url: os.environ/DATABASE_URL            # virtual keys, budgets, spend logs
  disable_spend_logs: false                        # per-request audit trail (metadata only)
  store_prompts_in_spend_logs: false               # do not keep prompt/response bodies
  allow_requests_on_db_unavailable: false          # fail closed: no DB = no budget checks = no service

litellm_settings:
  drop_params: true
  request_timeout: 600
  # Budgets are enforced in API-list-price dollars, even for subscription
  # traffic (it is a usage meter there, not a bill).
  max_budget: 200          # global safety net for the whole gateway
  budget_duration: 1d
