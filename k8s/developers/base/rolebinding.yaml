# Binds the sandbox-developer ClusterRole to the owner, in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-developer
subjects:
- kind: User
  apiGroup: rbac.authorization.k8s.io
  name: REPLACED-BY-OVERLAY
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: sandbox-developer
