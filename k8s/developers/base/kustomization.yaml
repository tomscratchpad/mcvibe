# One developer's sandbox namespace. Never applied directly: users/<slug>/
# overlays (generated by ../developer.sh) set the namespace name, the owner
# annotation and the RoleBinding subject.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- quota.yaml
- netpol-default-deny.yaml
- rolebinding.yaml
- claude-code-managed-settings.yaml
- sandboxtemplate.yaml
- warmpool.yaml
