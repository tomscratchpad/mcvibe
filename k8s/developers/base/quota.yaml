# Per-developer cap. With one namespace per developer the quota is also a
# per-person spend/blast-radius limit (2 concurrent sandboxes here; size for
# real nodes in production). Model spend is capped separately in LiteLLM.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
spec:
  hard:
    pods: "2"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    requests.ephemeral-storage: 8Gi
    limits.ephemeral-storage: 16Gi
    persistentvolumeclaims: "0"
    services: "4"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-defaults
spec:
  limits:
  - type: Container
    default:        { cpu: "1",  memory: 1Gi,   ephemeral-storage: 4Gi }
    defaultRequest: { cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi }
    max:            { cpu: "2",  memory: 2Gi,   ephemeral-storage: 8Gi }
