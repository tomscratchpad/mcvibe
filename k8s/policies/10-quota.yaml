# Blast-radius / runaway-resource limits for the agent-sessions namespace.
# Sized for the single 8 vCPU / 5 GiB demo node. Kata adds a fixed per-pod
# overhead (250m CPU, 320Mi) via its RuntimeClass, which the quota accounts for.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent-sessions-quota
  namespace: agent-sessions
spec:
  hard:
    pods: "4"
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "6"
    limits.memory: 6Gi
    requests.ephemeral-storage: 20Gi
    limits.ephemeral-storage: 40Gi
    persistentvolumeclaims: "4"
    requests.storage: 40Gi
    services: "8"                 # ClusterIP only (router -> sandbox)
    services.loadbalancers: "0"   # never exposed outside the cluster
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: agent-sessions-defaults
  namespace: agent-sessions
spec:
  limits:
  - type: Container
    default:          { cpu: "1",    memory: 1Gi,   ephemeral-storage: 8Gi }
    defaultRequest:   { cpu: 250m,   memory: 512Mi, ephemeral-storage: 2Gi }
    max:              { cpu: "2",    memory: 2Gi,   ephemeral-storage: 10Gi }
