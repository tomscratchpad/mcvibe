# Network policy for the LLM gateway namespace.
#
#  litellm ingress: only agent session pods, only on the LiteLLM port (4000).
#  litellm egress : DNS, its Postgres, and the egress proxy's "gateway" listener
#                   (which allowlists the provider API hostnames). No direct
#                   internet, no other cluster services, no metadata server.
#  postgres       : see ../llm-gateway/litellm.yaml (ingress from litellm only, no egress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: llm-gateway
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm
  namespace: llm-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          agent-platform/sessions: "true"
    ports:
    - { protocol: TCP, port: 4000 }
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgres
    ports:
    - { protocol: TCP, port: 5432 }
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: egress-proxy
      podSelector:
        matchLabels:
          app.kubernetes.io/name: egress-proxy
    ports:
    - { protocol: TCP, port: 3129 }
